spring:
  application:
    name: users-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/users_db
    username: strife
    password: strife
    driverClassName: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    # Sans contexte explicite Liquibase joue TOUS les changeSets, y compris
    # ceux marques context="seed" : la valeur par defaut "default" est donc
    # ce qui garde le jeu de donnees de dev hors de la base.
    # Pour le charger : LIQUIBASE_CONTEXTS=seed.
    contexts: ${LIQUIBASE_CONTEXTS:default}
  rabbitmq:
    host: localhost
    port: 5672
    username: strife
    password: strife
server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

