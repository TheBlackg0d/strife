spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/v1/auth/**,/api/v1/account/**
            - id: users-service
              uri: http://users-service:8082
              predicates:
                - Path=/api/v1/relationships/**,/api/v1/profile/**
            - id: messaging-service
              uri: http://messaging-service:8084
              predicates:
                - Path=/api/v1/channel/**,/api/v1/message/**
            - id: file-service
              uri: http://file-service:8087
              predicates:
                - Path=/api/v1/files/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
