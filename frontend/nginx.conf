server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA : toute route inconnue retombe sur index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le front ne parle jamais directement aux services : tout passe par
    # l'API Gateway (ADR-0012, isolation réseau).
    location /api/ {
        proxy_pass http://api-gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket vers le realtime-gateway.
    location /ws {
        proxy_pass http://realtime-gateway:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
