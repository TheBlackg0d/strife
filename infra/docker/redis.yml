services:
  redis:
    image: redis:7
    container_name: strife-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - strife-net

volumes:
  redis-data:

networks:
  strife-net:
    driver: bridge
