services:
  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: strife-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: strife
      RABBITMQ_DEFAULT_PASS: strife
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - strife-net

volumes:
  rabbitmq-data:

networks:
  strife-net:
    driver: bridge
