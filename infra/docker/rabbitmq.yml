services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: strife-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: strife
      RABBITMQ_DEFAULT_PASS: strife
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - strife-net
volumes:
  rabbitmq-data:
