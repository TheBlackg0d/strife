services:
  auth-service:
    build:
      context: ../../auth-service
      dockerfile: Dockerfile
    image: strife/auth-service:latest
    container_name: strife-auth-service
    extends:
      file: common-config.yml
      service: microservice-db-config
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # LIQUIBASE_CONTEXTS=seed charge les comptes de demo (voir le changeSet
      # 004-seed-dev-accounts). Doit valoir la meme chose pour users-service,
      # sinon on aurait des comptes sans profil.
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-default}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8081/actuator/health | grep -q UP",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # `docker compose watch` : le jar est construit hors image (voir Dockerfile),
    # donc on ne reconstruit pas l'image a chaque changement — on copie le fat
    # jar dans le conteneur et on redemarre la JVM (~2 s au lieu de ~40 s).
    # Boucle de dev :
    #   docker compose watch                                       # terminal 1
    #   mvn -f ../../pom.xml package -pl auth-service -am -DskipTests
    # Le Dockerfile reste surveille en `rebuild` : lui seul change l'image.
    develop:
      watch:
        - action: sync+restart
          path: ../../auth-service/target/auth-service-latest.jar
          target: /app.jar
        - action: rebuild
          path: ../../auth-service/Dockerfile

  users-service:
    build:
      context: ../../users-service
      dockerfile: Dockerfile
    image: strife/users-service:latest
    container_name: strife-users-service
    extends:
      file: common-config.yml
      service: microservice-db-config
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users_db
      # Voir auth-service : les deux services doivent partager la meme valeur.
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-default}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8082/actuator/health | grep -q UP",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ../../users-service/target/users-service-latest.jar
          target: /app.jar
        - action: rebuild
          path: ../../users-service/Dockerfile

  guild-service:
    build:
      context: ../../guild-service
      dockerfile: Dockerfile
    image: strife/guild-service:latest
    container_name: strife-guild-service
    extends:
      file: common-config.yml
      service: microservice-db-config
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/guild_db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8083/actuator/health | grep -q UP",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ../../guild-service/target/guild-service-latest.jar
          target: /app.jar
        - action: rebuild
          path: ../../guild-service/Dockerfile

  messaging-service:
    build:
      context: ../../messaging-service
      dockerfile: Dockerfile
    image: strife/messaging-service:latest
    container_name: strife-messaging-service
    extends:
      file: common-config.yml
      service: microservice-db-config
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/messaging_db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8084/actuator/health | grep -q UP",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ../../messaging-service/target/messaging-service-latest.jar
          target: /app.jar
        - action: rebuild
          path: ../../messaging-service/Dockerfile

  event-store-service:
    build:
      context: ../../event-store-service
      dockerfile: Dockerfile
    image: strife/event-store-service:latest
    container_name: strife-event-store-service
    extends:
      file: common-config.yml
      service: microservice-db-config
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventstore_db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8086/actuator/health | grep -q UP",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ../../event-store-service/target/event-store-service-latest.jar
          target: /app.jar
        - action: rebuild
          path: ../../event-store-service/Dockerfile

  realtime-gateway:
    build:
      context: ../../realtime-gateway
      dockerfile: Dockerfile
    image: strife/realtime-gateway:latest
    container_name: strife-realtime-gateway
    extends:
      file: common-config.yml
      service: microservice-base-config
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8085:8085"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8085/actuator/health | grep -q UP",
