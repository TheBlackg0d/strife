services:
  auth-service:
    build:
      context: ../../auth-service
      dockerfile: Dockerfile
    image: strife/auth-service:latest
    container_name: strife-auth-service
    extends:
      file: common-config.yml
      service: microservice-db-config
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      STRIFE_SEED_ENABLED: ${STRIFE_SEED_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8081/actuator/health | grep -q UP",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ../../auth-service/target/auth-service-latest.jar
          target: /app.jar
        - action: rebuild
          path: ../../auth-service/Dockerfile

  users-service:
    build:
      context: ../../users-service
      dockerfile: Dockerfile
    image: strife/users-service:latest
    container_name: strife-users-service
