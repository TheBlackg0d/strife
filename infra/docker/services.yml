  api-gateway:
    build:
      context: ../../api-gateway
      dockerfile: Dockerfile
    image: strife/api-gateway:latest
    container_name: strife-api-gateway
    extends:
      file: common-config.yml
      service: microservice-base-config
    environment:
      EUREKA_CLIENT_ENABLED: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8080/actuator/health | grep -q UP",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      auth-service:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ../../api-gateway/target/api-gateway-latest.jar
          target: /app.jar
        - action: rebuild
          path: ../../api-gateway/Dockerfile

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: strife/frontend:latest
    container_name: strife-frontend
    extends:
      file: common-config.yml
      service: network-deploy-service
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - api-gateway

networks:
  strife-net:
    driver: bridge
