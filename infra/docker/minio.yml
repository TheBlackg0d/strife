services:
  minio:
    image: minio/minio:latest
    container_name: strife-minio
    ports:
      - "7000:9000"
      - "7001:9001"
    environment:
      MINIO_ROOT_USER: strife
      MINIO_ROOT_PASSWORD: strife
      MINIO_ACCESS_KEY: strife
      MINIO_SECRET_KEY: strife
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - strife-net

volumes:
  minio-data:
