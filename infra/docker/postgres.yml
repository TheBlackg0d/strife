services:
  postgres:
    image: postgres:16
    container_name: strife-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: strife
      POSTGRES_PASSWORD: strife
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Chemin relatif AU FICHIER COMPOSE (infra/docker/) -> infra/postgres/.
      - ../postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    # Les services attendent ce healthcheck (depends_on: service_healthy) :
    # sans ça ils démarrent avant que Postgres accepte les connexions.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strife"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - strife-net

volumes:
  postgres-data:

networks:
  strife-net:
    driver: bridge
