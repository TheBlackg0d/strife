services:
  postgres:
  image: postgres:16
  container_name: strife-postgres
  ports:
    - "5432:5432"
  environment:
    POSTGRES_USER: strife
    POSTGRES_PASSWORD: strife
    POSTGRES_DB: postgres
  volumes:
    - postgres-data:/var/lib/postgresql/data
    - ../infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
  networks:
    - strife-net
volumes:
  postgres-data:
