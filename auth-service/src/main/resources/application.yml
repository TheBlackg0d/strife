spring:
  application:
    name: auth-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: root
    password: root
    driverClassName: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
  rabbitmq:
    host: localhost
    port: 5672
    username: strife
    password: strife

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
strife:
  seed:
    # Comptes de dev crees au demarrage par DevAccountSeeder.
    enabled: ${STRIFE_SEED_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}
  expiration: 300000
  refresh-token:
    expiration: 604800

cookie:
  secure: ${COOKIE_SECURE:false}
  http-only: true
  same-site: ${COOKIE_SAME_SITE:Lax}
  name: refreshToken
  expiration: 604800
