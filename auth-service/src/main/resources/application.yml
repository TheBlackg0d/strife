spring:
  application:
    name: auth-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: root
    password: root
    driverClassName: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    # Sans contexte explicite Liquibase joue TOUS les changeSets, y compris
    # ceux marques context="seed" : la valeur par defaut "default" est donc
    # ce qui garde le jeu de donnees de dev hors de la base.
    # Pour le charger : LIQUIBASE_CONTEXTS=seed.
    contexts: ${LIQUIBASE_CONTEXTS:default}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
  rabbitmq:
    host: localhost
    port: 5672
    username: strife
    password: strife

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
jwt:
  secret: ${JWT_SECRET}
  expiration: 300000
  refresh-token:
    expiration: 604800

cookie:
  # Secure exige HTTPS : le navigateur jette silencieusement le cookie en
  # http://localhost. Passer COOKIE_SECURE=true (et same-site=none) en prod.
  secure: ${COOKIE_SECURE:false}
  http-only: true
  same-site: ${COOKIE_SAME_SITE:Lax}
  name: refreshToken
  expiration: 604800
